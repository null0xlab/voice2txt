<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>voice2txt - Side Panel</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 100% !important;
      height: 100vh;
      padding: 10px;
    }
    .card {
      height: 100%;
      border-radius: 0;
      border: none;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .output-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    textarea {
      flex: 1;
      min-height: 150px;
    }
  </style>
</head>
<body>
  <div class="card">
    <header class="header">
      <h1 class="title">voice2txt</h1>
      <button id="settingsBtn" class="icon-button" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <main class="content">


      <!-- Controls Panel -->
      <div class="controls-panel">
        <!-- Unified Language Selector -->
        <div id="langContainer" class="control-group">
          <label for="dictationLang">Language</label>
          <select id="dictationLang" class="styled-select">
            <!-- Populated dynamically from languages.js -->
          </select>
        </div>
      </div>

      <!-- Visualizer and Microphone Button -->
      <div class="mic-container">
        <div class="visualizer">
          <div class="wave wave-1"></div>
          <div class="wave wave-2"></div>
          <div class="wave wave-3"></div>
        </div>
        <button id="recordBtn" class="mic-button" title="Click to start listening">
          <svg class="mic-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10a1 1 0 0 0-1 1v1a7 7 0 0 1-14 0v-1a1 1 0 0 0-2 0v1a9 9 0 0 0 8 8.94V21h-2a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-1.06A9 9 0 0 0 22 11v-1a1 1 0 0 0-1-1z"/>
          </svg>
        </button>
        <div id="statusText" class="status-text">Idle</div>
      </div>

      <!-- Output Container -->
      <div class="output-container">
        <textarea id="transcriptionOutput" placeholder="Transcription will appear here..." readonly></textarea>
        
        <div class="action-buttons">
          <button id="copyBtn" class="action-btn secondary" title="Copy to Clipboard">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
          </button>
          
          <button id="insertBtn" class="action-btn primary" title="Insert text into active field">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
            Insert
          </button>
        </div>
      </div>
    </main>

    <!-- Unsupported Browser Warning -->
    <div id="unsupportedBrowserContainer" class="unsupported-container hidden">
      <div class="unsupported-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--accent-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <h2>Browser Not Supported</h2>
      <p>This extension requires advanced browser-native APIs and is only supported on <strong>Google Chrome</strong> and <strong>Microsoft Edge</strong>.</p>
      <div class="supported-browsers-list">
        <div class="browser-item">
          <span class="browser-bullet">•</span>
          <span>Google Chrome</span>
        </div>
        <div class="browser-item">
          <span class="browser-bullet">•</span>
          <span>Microsoft Edge</span>
        </div>
      </div>
    </div>
  </div>
  <!-- Use the exact same popup.js script as popup.html since elements match 1:1 -->
  <script src="languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
